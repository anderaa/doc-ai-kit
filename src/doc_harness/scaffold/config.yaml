# Project configuration. Every value here is recorded in each run's metadata, and the whole
# file is hashed into a config fingerprint, so a run can always be traced to its settings.

models:
  # There is no default. The harness will not choose a model, and will not spend money, for you.
  # DSPy provider/name form, e.g. anthropic/claude-sonnet-5
  task: null
  # Used by MIPROv2 and GEPA to propose instructions. Set it explicitly even if it matches task.
  reflection: null
  # the Claude 5 family accepts only temperature=1; lower it only for a model that allows it
  temperature: 1.0
  # counts thinking as well as the answer: a reply that spends it all thinking returns nothing
  max_tokens: 4096
  # how hard the task model thinks: low | medium | high | xhigh | max, or null for the
  # provider's default. Thinking is billed as output and counts against max_tokens. Measure a
  # lower effort on a labeled split before adopting it -- see examples/adversarial for a run
  task_effort: null
  # adaptive | disabled | null. Prefer lowering task_effort to disabling thinking outright;
  # the two cannot be combined
  task_thinking: null

extraction:
  extractor: pymupdf
  fallback_extractor: pdfplumber
  # pages with no usable text layer -- scans -- are read by Claude from an image of the page
  transcription:
    # thin_pages: only pages below min_chars_per_page. all_pages: every page, for PDFs whose
    # text layer is garbage from a bad earlier OCR. off: never; thin pages are only flagged
    mode: thin_pages
    # no default, as with models.task: a corpus of clean PDFs never needs it. Pages that need
    # it are flagged by extract until it is set, and set later, only those documents are redone
    model: null
    # a page is treated as scanned when it has fewer characters than this AND images cover
    # at least min_image_coverage of it; most short pages are simply short
    min_chars_per_page: 100
    min_image_coverage: 0.5
    # the longer edge of the page image; larger reads small print better and costs more
    max_image_px: 2000
    max_tokens: 8192
    num_threads: 4
  truncation:
    # declared once and applied identically in validation and production; null means no limit
    max_chars: null
    strategy: head        # head | head_tail
    head_share: 0.7

splits:
  # fixed, committed, and never changed after labeling starts
  seed: 20260918
  # classes below this leave the optimization target but are still scored and reported
  support_floor: 30
  # classes below this cannot carry a reported number at all
  measurable_floor: 10

optimization:
  optimizer: MIPROv2        # BootstrapFewShot | BootstrapFewShotWithRandomSearch | MIPROv2 | GEPA | SIMBA
  auto: light               # light | medium | heavy -- heavy has consumed thousands of rollouts
  module: predict           # predict | chain_of_thought -- measure it, do not assume it helps
  max_bootstrapped_demos: 4
  max_labeled_demos: 4
  # how many candidates to propose and how many to evaluate. Left null, the optimizer picks
  # from `auto`, which on a small validation split means far more trials than that split can
  # tell apart. Set them once you know how long one trial actually takes.
  num_candidates: null
  num_trials: null
  # SIMBA only
  max_steps: 8
  num_threads: 8
  max_experiments: 8
  max_rollouts: 2000

metric:
  # scored: predicting null when gold is null is a true negative.
  # best_guess: the program answers anyway. This changes the metric, not just the prompt,
  # so switching it is a decision to record in decisions.md.
  abstention: scored
  bootstrap_resamples: 2000
  # added by hand when make-splits records a report_unmeasured decision; never inferred.
  # make-splits prints the exact line to add rather than rewriting this file, which would
  # strip every comment in it
  excluded_classes: {}

evaluation:
  # a reply that cannot be read is retried with a fresh generation this many times
  max_retries: 2
  # share of replies still failing after retries above which a scoring run refuses to report
  # numbers. A failure is never scored as an abstention; below this it counts as a wrong answer
  max_failure_rate: 0.0

production:
  max_retries: 3
  batch_size: 32
  num_threads: 8
  # submit through the Message Batches API: half the price, usually done within the hour and
  # always within a day. Anthropic models only; anything else runs live. A document the batch
  # cannot deliver falls back to a live request, with the usual retries
  use_batch_api: true
  batch_poll_seconds: 60
  spot_check_sample: 50
  max_schema_failure_rate: 0.005

budget:
  # the cost ceiling for this engagement; there is no default that spends money
  max_usd: null
