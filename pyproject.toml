[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-harness"
version = "0.1.7"
description = "A fixed harness for running document classification and extraction projects with DSPy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Aaron Anderson" }]
dependencies = [
    "dspy[optuna]==3.3.1",
    # production submits through the Message Batches API; the official SDK, not hand-rolled HTTP
    "anthropic>=1.7,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "python-dateutil>=2.9",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    # the labeling sheet is .xlsx: Excel rewrites CSV cells on open, dropping leading zeros
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pip-tools>=7.4",
    "reportlab>=4.2",
    "types-PyYAML",
    "types-python-dateutil",
    "types-openpyxl",
]

[project.scripts]
newproject = "doc_harness.cli:newproject"
doc-harness = "doc_harness.cli:main"

[tool.hatch.build.targets.wheel]
# scaffold/ lives inside the package, so `packages` already carries it. A force-include
# on top of that adds every scaffold file to the wheel twice and the build fails outright.
packages = ["src/doc_harness"]
artifacts = ["src/doc_harness/scaffold/**"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dspy.*", "json_repair.*", "regex.*", "pymupdf", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
