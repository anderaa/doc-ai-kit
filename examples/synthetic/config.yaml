# Dogfood settings. The floors are low because twenty documents cannot reach a real support
# floor; that is a property of the acceptance test, not a recommendation.

models:
  task: anthropic/claude-sonnet-5
  reflection: anthropic/claude-opus-5
  temperature: 1.0
  max_tokens: 4096

extraction:
  extractor: pymupdf
  fallback_extractor: pdfplumber
  # generated PDFs always have a text layer
  transcription:
    mode: "off"
  truncation:
    max_chars: null
    strategy: head

splits:
  seed: 20260918
  support_floor: 3
  measurable_floor: 3

optimization:
  optimizer: BootstrapFewShot
  auto: light
  module: predict
  max_bootstrapped_demos: 3
  max_labeled_demos: 3
  num_threads: 4
  max_experiments: 4
  max_rollouts: 1500

metric:
  abstention: scored
  bootstrap_resamples: 500
  excluded_classes: {}

production:
  max_retries: 2
  batch_size: 8
  spot_check_sample: 5
  max_schema_failure_rate: 0.005

budget:
  max_usd: 20.0
